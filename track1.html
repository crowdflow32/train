<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Crowd Management System</title>

    <link rel="stylesheet" href="track.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>

<body>

    <header class="text-center text-uppercase py-3">
        <h1>Crowd Flow</h1>
        <h4>PRJ- NDL(7:43 AM - Normal)</h4>
    </header>

    <main class="text-center">
        <div class="container">
            <h6>Index</h6>
            <div class="row">
                <div class="card col-8" style="background-color: red; color: white;">Extreme</div>
                <div class="card col-8" style="background-color: orange;">High</div>
                <div class="card col-8" style="background-color: #b2ddfd;">Normal</div>
                <div class="card col-8" style="background-color: greenyellow;">Low</div>
            </div>
        </div>
        <h3>Coaches</h3>
        <div class="coachContainer">
            <div class="contain coachSlide">
                <div class="coach">
                    <div class="card" style="background-color: #e4dad2;">GUARD CAB</div>
                </div>
                <div class="coach">
                    <div class="card">Ladies 2</div>
                </div>
                <div class="coach">
                    <div class="card" style="background-color:#b2ddfd;">Coach 3</div>
                </div>
                <div class="coach">
                    <div class="card" style="background-color: #b2ddfd;">First Class 2</div>
                </div>
                <div class="coach">
                    <div class="card">Ladies FC 2</div>
                </div>
                <div class="coach">
                    <div class="card" style="background-color: #b2ddfd;">Coach 2</div>
                </div>
                <div class="coach">
                    <div class="card">Ladies FC 1</div>
                </div>
                <div class="coach">
                    <div class="card" style="background-color: #b2ddfd;">First Class 1</div>
                </div>
                <div class="coach">
                    <div class="card">Coach 1</div>
                </div>
                <div class="coach">
                    <div class="card">Ladies 1</div>
                </div>
                <div class="coach">
                    <div class="card" style="background-color: #e4dad2;">MOTOR MAN CAB</div>
                </div>

            </div>
        </div>
    </main>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"></script>
</body>

</html>
